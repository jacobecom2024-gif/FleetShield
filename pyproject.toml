[project]
name = "fleetshield"
version = "0.2.0"
description = "Failure-driven deterministic safety controls for autonomous agent fleets"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
google = [
  "google-adk>=2.6,<3",
  "google-genai>=2.9,<3",
  "google-cloud-firestore>=2.20,<3",
  "google-cloud-pubsub>=2.25,<3",
]

[project.scripts]
fleetshield = "app.api:serve"

[tool.setuptools]
packages = ["app"]
