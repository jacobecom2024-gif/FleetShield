steps:
  - name: python:3.12-slim
    entrypoint: python
    args: ["-m", "unittest", "discover", "-s", "tests", "-v"]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/fleetshield/app:${SHORT_SHA}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/fleetshield/app:${SHORT_SHA}"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - fleetshield
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/fleetshield/app:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=1
      - --cpu=1
      - --memory=512Mi
      - --concurrency=20
      - --timeout=60
      - --set-env-vars=GEMINI_MODEL=gemini-3.5-flash,GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${_VERTEX_LOCATION},FLEETSHIELD_STATE_BACKEND=firestore
substitutions:
  _REGION: europe-west1
  _VERTEX_LOCATION: global
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/fleetshield/app:${SHORT_SHA}
